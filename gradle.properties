# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# -------------------------
# JVM & Encoding
# -------------------------
# Purpose: JVM options used by the Gradle daemon (heap size, system props).
# Benefit: Prevents OOM during compilation and enforces consistent file encoding.
# Recommended: Adjust -Xmx to match machine/CI memory (2g-8g). Keep UTF-8 encoding.
# Gotchas: Very large Xmx on low-RAM machines may cause swapping.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# -------------------------
# Parallel configuration (incubating / optional)
# -------------------------
# Purpose: Allow Gradle to configure and run work in parallel across projects.
# Benefit: Reduces wall-clock time on multi-module projects by using multiple cores.
# Recommended: true on developer machines/CI with available CPU; test for thread-safety.
# Gotchas: Some custom tasks/annotation processors may not be thread-safe; disable if flaky.
# When configuring, prefer to use the later enabled setting below. This commented flag
# shows the legacy example for reference.
# org.gradle.parallel=true

# -------------------------
# AndroidX & Kotlin style
# -------------------------
# Purpose: Prefer AndroidX artifacts over old support libraries.
# Benefit: Ensures consistent dependency space and avoids mixed-support conflicts.
# Recommended: true for modern Android projects (migrate if you still use support libs).
# Gotchas: Enabling without migrating dependencies may break builds.
android.useAndroidX=true

# Purpose: Kotlin code style used by some tools/formatters.
# Benefit: Keeps formatting consistent across developers when tools respect this key.
# Recommended: "official" (or team-agreed value).
# Gotchas: Styling only - not a build correctness setting.
kotlin.code.style=official

# -------------------------
# Resource namespacing
# -------------------------
# Purpose: Make library R classes non-transitive so they only contain their own resources.
# Benefit: Smaller R classes, improved incremental compilation, fewer accidental cross-module resource accesses.
# Recommended: true for modularized projects.
# Gotchas: Code that relied on accessing another module's R may need API changes.
android.nonTransitiveRClass=true

# Purpose: Suppress AGP warnings/errors when using a newer compileSdk than AGP supports.
# Benefit: Lets you build against a newer SDK level intentionally when needed.
# Recommended: Use only when you intentionally set a newer compileSdk; remove once AGP supports it.
# Gotchas: AGP may not fully support newer SDKs - test thoroughly.
android.suppressUnsupportedCompileSdk=34

# -------------------------
# Performance & reproducibility hints
# -------------------------
# Purpose: Keep the Gradle daemon alive between builds to avoid JVM startup cost.
# Benefit: Faster subsequent builds on the same machine (warm JVM).
# Recommended: true on developer machines and CI runners that reuse the workspace.
# Gotchas: Not ideal on extremely memory-constrained CI containers.
org.gradle.daemon=true

# Purpose: Let Gradle run independent project tasks in parallel for faster builds.
# Benefit: Shorter build times on multi-core machines.
# Recommended: true when projects/tasks are isolated and thread-safe.
# Gotchas: Could expose non-thread-safe tasks/processors.
org.gradle.parallel=true

# Purpose: Configure only the projects required for a task (configure-on-demand).
# Benefit: Reduces configuration time for commands targeting a subset of modules.
# Recommended: true for large decoupled multi-module projects.
# Gotchas: Some builds rely on configuration side effects from other modules - test it.
org.gradle.configureondemand=true

# Purpose: Enable the Gradle build cache to reuse task outputs between builds.
# Benefit: Significant speedups by avoiding re-execution of up-to-date tasks locally and on CI (with remote cache).
# Recommended: true. Consider adding a remote cache for CI to share outputs across agents.
# Gotchas: Non-deterministic tasks or tasks that don't declare inputs/outputs correctly may produce wrong cached outputs.
org.gradle.caching=true

# Purpose: Limit the maximum number of Gradle worker threads used for parallel work.
# Benefit: Lets you tune parallelism to available CPU/memory to avoid overload.
# Recommended: Set to number of logical cores or slightly less (e.g., 4, 8) depending on machine.
# Gotchas: Too many workers on small machines cause swapping; too few underutilizes resources.
org.gradle.workers.max=4

# -------------------------
# Kotlin / KAPT incremental & worker settings
# -------------------------
# Purpose: Enable Kotlin incremental compilation so only changed files are recompiled.
# Benefit: Speeds up Kotlin compilation during incremental builds.
# Recommended: true.
# Gotchas: Some annotation processors or unsupported code patterns may prevent incremental behavior.
kotlin.incremental=true

# Purpose: Run Kotlin compilation out-of-process to isolate memory and improve stability.
# Benefit: Reduces memory contention with the Gradle daemon and enables better parallelism.
# Recommended: out-of-process for larger projects.
# Gotchas: Slight extra process startup overhead; usually beneficial overall.
kotlin.compiler.execution.strategy=out-of-process

# Purpose: Use the Gradle worker API for KAPT to parallelize annotation processing.
# Benefit: Faster annotation processing and better isolation.
# Recommended: true when using KAPT (Room, Dagger, etc.).
# Gotchas: Some annotation processors might not be thread-safe; monitor for flakiness.
kapt.use.worker.api=true

# Purpose: Enable incremental annotation processing for processors that support it.
# Benefit: Avoids full re-run of annotation processors when only small code changes happen.
# Recommended: true.
# Gotchas: Only applies to processors that declare themselves as incremental; others will be non-incremental.
kapt.incremental.apt=true

# -------------------------
# Optional toggles
# -------------------------
# Purpose: Jetifier rewrites old support-library binaries to AndroidX at build time.
# Benefit: Allows using older dependencies that haven't migrated to AndroidX.
# Recommended: false if all dependencies are AndroidX; otherwise true.
# Gotchas: Disabling Jetifier while depending on non-AndroidX artifacts will break builds.
android.enableJetifier=false