plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.serialization)
    id 'jacoco'
    alias(libs.plugins.ktlint)
    alias(libs.plugins.detekt)
}

apply plugin: 'kotlin-kapt'

android {
    namespace 'com.codetutor.countryinfoapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.codetutor.countryinfoapp"
        minSdk 25
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled false // Disable to avoid conflicts with JaCoCo
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion libs.versions.compose.compiler.get()
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    buildToolsVersion '34.0.0'
}

// Configure dependency locking
dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

dependencies {
    // AndroidX Core
    implementation libs.androidx.core.ktx
    implementation libs.androidx.activity.compose

    // Lifecycle
    implementation libs.bundles.lifecycle

    // Compose BOM and UI
    implementation platform(libs.androidx.compose.bom)
    implementation libs.bundles.compose
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.compose.ui.legacy

    // ConstraintLayout
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.constraintlayout.compose

    // Room
    implementation libs.bundles.room
    kapt libs.androidx.room.compiler

    // Networking
    implementation libs.bundles.retrofit
    implementation libs.coil.compose

    // Serialization
    implementation libs.kotlinx.serialization.json
    implementation libs.gson

    // Testing
    testImplementation libs.bundles.testing
    testImplementation libs.okhttp
    testImplementation libs.okhttp.mockwebserver
    testImplementation libs.androidx.room.testing

    // Android Testing
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    androidTestImplementation platform(libs.androidx.compose.bom)

    // Debug
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest

    // Detekt plugins
    detektPlugins libs.detekt.formatting
    detektPlugins libs.detekt.rules.libraries
    detektPlugins libs.detekt.compose.rules
}

// JaCoCo configuration
jacoco {
    toolVersion = "0.8.8"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    
    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/jacocoTestReport/html')
    }
    
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/databinding/**',
        '**/android/databinding/**',
        '**/androidx/databinding/**',
        '**/*DataBindingImpl.class',
        '**/*DataBinding.class',
        '**/BR.class'
    ]
    
    def debugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"
    
    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ]))
}

// ktlint configuration
ktlint {
    version = "1.0.1"
    android = true
    ignoreFailures = false
    reporters {
        reporter "plain"
        reporter "checkstyle"
        reporter "html"
        reporter "json"
    }
    filter {
        exclude("**/generated/**")
        exclude("**/build/**")
    }
}

// Detekt configuration
detekt {
    // Version of Detekt that will be used
    toolVersion = "1.23.7"

    // Builds the AST in parallel. Rules are always executed in parallel.
    parallel = true

    // Define the detekt configuration files
    config.setFrom(files("$projectDir/../detekt-config.yml"))

    // Adds the baseline file for suppressing known issues
    baseline = file("$projectDir/detekt-baseline.xml")

    // Turns on all the rules
    allRules = false

    // Fail build on any finding
    ignoreFailures = false

    // Android specific setup
    buildUponDefaultConfig = true
}

// Configure detekt tasks
tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "11"

    // Exclude build and generated directories
    exclude("**/build/**", "**/generated/**", "**/resources/**")

    // Include all Kotlin and script files
    include("**/*.kt", "**/*.kts")

    reports {
        html {
            required.set(true)
            outputLocation.set(file("build/reports/detekt/detekt.html"))
        }
        xml {
            required.set(true)
            outputLocation.set(file("build/reports/detekt/detekt.xml"))
        }
        txt {
            required.set(true)
            outputLocation.set(file("build/reports/detekt/detekt.txt"))
        }
        sarif {
            required.set(true)
            outputLocation.set(file("build/reports/detekt/detekt.sarif"))
        }
        md {
            required.set(true)
            outputLocation.set(file("build/reports/detekt/detekt.md"))
        }
    }
}
