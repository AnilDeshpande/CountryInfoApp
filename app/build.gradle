plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'jacoco'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'io.gitlab.arturbosch.detekt'
}

apply plugin: 'kotlin-kapt'

android {
    namespace 'com.codetutor.countryinfoapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.codetutor.countryinfoapp"
        minSdk 25
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            testCoverageEnabled false // Disable to avoid conflicts with JaCoCo
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    buildToolsVersion '34.0.0'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'androidx.activity:activity-compose:1.5.1'
    implementation platform('androidx.compose:compose-bom:2022.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.constraintlayout:constraintlayout:2.2.0-alpha12"
    implementation "androidx.constraintlayout:constraintlayout-compose:1.1.0-alpha12"
    implementation "androidx.compose.material:material-icons-extended:1.0.0-alpha08"
    implementation 'androidx.room:room-common:2.6.1'
    kapt "androidx.room:room-compiler:2.6.1"
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    testImplementation 'junit:junit:4.13.2'
    // Additional dependencies for Compose testing
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.5.1"
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2022.10.00')
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.5.1"
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    implementation("io.coil-kt:coil-compose:2.4.0")
    // LiveData
    implementation("androidx.lifecycle:lifecycle-livedata-ktx:2.7.0")
    // Lifecycles only (without ViewModel or LiveData)
    implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
    // Lifecycle utilities for Compose
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.7.0")

    // Saved state module for ViewModel
    implementation("androidx.lifecycle:lifecycle-viewmodel-savedstate:2.7.0")
    implementation 'androidx.compose.runtime:runtime-livedata:1.0.0'
    implementation 'androidx.compose.ui:ui:1.1.0'

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // OkHttp for logging (optional)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines testing - needed for testing suspend functions
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"

    // MockK - for mocking CountryDao and CountryListServiceProvider
    testImplementation "io.mockk:mockk:1.13.8"

    // MockWebServer for testing network layer
    testImplementation "com.squareup.okhttp3:mockwebserver:4.12.0"

    // OkHttp core for MockWebServer compatibility
    testImplementation "com.squareup.okhttp3:okhttp:4.12.0"

    // AndroidX Test Core
    testImplementation "androidx.test:core:1.5.0"

    // Room testing utilities
    testImplementation "androidx.room:room-testing:2.5.0"

    // Architecture Components testing
    testImplementation "androidx.arch.core:core-testing:2.2.0"

    // Truth for more readable assertions
    testImplementation "com.google.truth:truth:1.1.5"

    testImplementation 'com.google.code.gson:gson:2.10.1'

    // Robolectric for Android unit tests with Context
    testImplementation "org.robolectric:robolectric:4.10.3"

    // Detekt plugins for additional rules
    detektPlugins "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.7"
    detektPlugins "io.gitlab.arturbosch.detekt:detekt-rules-libraries:1.23.7"
    detektPlugins "com.twitter.compose.rules:detekt:0.0.26"
}

// JaCoCo configuration
jacoco {
    toolVersion = "0.8.8"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/jacocoTestReport/html')
    }

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            'android/**/*.*',
            '**/databinding/**',
            '**/android/databinding/**',
            '**/androidx/databinding/**',
            '**/*DataBindingImpl.class',
            '**/*DataBinding.class',
            '**/BR.class'
    ]

    def debugTree = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: project.buildDir, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ]))
}

ktlint {
    version = "1.0.1"
    android = true
    ignoreFailures = false
    reporters {
        reporter "plain"
        reporter "checkstyle"
        reporter "html"
        reporter "json"
    }
    filter {
        exclude("**/generated/**")
        exclude("**/build/**")
    }
}

detekt {
    toolVersion = "1.23.7"
    parallel = true
    config.setFrom(files("$projectDir/../detekt-config.yml"))
    baseline = file("$projectDir/detekt-baseline.xml")
    allRules = false
    ignoreFailures = false
    buildUponDefaultConfig = true
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "11"
    exclude("**/build/**", "**/generated/**", "**/resources/**")
    include("**/*.kt", "**/*.kts")
    reports {
        html.required.set(true)
        xml.required.set(true)
        txt.required.set(true)
        sarif.required.set(true)
        md.required.set(true)
    }
}

